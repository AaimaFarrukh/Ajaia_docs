# One-click deploy on Render (free plan). SQLite lives on ephemeral disk;
# seed data is recreated on every cold start, so reviewers always have demo users.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
